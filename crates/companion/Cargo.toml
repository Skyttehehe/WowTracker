[package]
name = "wowtracker-companion"
description = "Watches the WowTracker addon's SavedVariables file and sends it to the WowTracker backend"
version.workspace = true
edition.workspace = true

[lib]
name = "wowtracker_companion"
path = "src/lib.rs"

[[bin]]
name = "wowtracker-companion"
path = "src/main.rs"

[dependencies]
wowtracker-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
