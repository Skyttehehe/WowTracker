<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WoW Tracker</title>
  <meta name="description" content="Where my World of Warcraft: Forever character is, what level, and what it is fighting.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23e8b64c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23121417'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <h1 id="title">WoW Tracker</h1>
    <nav id="chars" class="chars" aria-label="Characters"></nav>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="layout">
    <section class="map-card" aria-label="Map">
      <div class="map-toolbar">
        <div class="seg" role="group" aria-label="Map view">
          <button type="button" data-view="continent" aria-pressed="true">Continent</button>
          <button type="button" data-view="zone" aria-pressed="false">Zone</button>
        </div>
        <span id="map-caption" class="muted"></span>
      </div>
      <div class="map-wrap">
        <svg id="map" viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map with the character's position"></svg>
      </div>
    </section>

    <aside id="panel" class="panel" aria-live="polite">
      <p class="muted">Loading…</p>
    </aside>
  </main>

  <footer class="foot">
    <span id="updated" class="muted"></span>
    <span class="muted">World of Warcraft and its map data © Blizzard Entertainment. Fan project, not affiliated with Blizzard.</span>
  </footer>
</body>
</html>
