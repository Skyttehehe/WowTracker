<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WoW Tracker</title>
  <meta name="description" content="Where my World of Warcraft: Forever character is, what level, and what it is doing.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23e3b45a'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230e1218'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=3">
  <script src="config.js?v=3"></script>
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <header class="hero">
    <div class="avatar" id="avatar" aria-hidden="true">?</div>
    <div class="who">
      <p class="eyebrow" id="realm"></p>
      <h1 id="name">WoW Tracker</h1>
      <p class="desc" id="desc">Loading…</p>
    </div>
    <div class="status">
      <span id="pill" class="pill"><i></i><span>…</span></span>
      <p class="muted small" id="seen"></p>
      <nav id="chars" class="chars" aria-label="Characters"></nav>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="grid">
    <section class="card" id="progress" aria-label="Progress"></section>
    <section class="card" id="vitals" aria-label="Vitals"></section>

    <section class="card zone-card" aria-label="Location">
      <div class="card-head">
        <h2 id="zone-name">Location</h2>
        <span id="coords" class="coords" hidden></span>
      </div>
      <p class="muted small" id="subzone"></p>
      <div class="map-frame">
        <svg id="map" viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map with the character's position"></svg>
        <div id="map-tip" class="map-tip" hidden></div>
      </div>
      <p class="muted small" id="trail-note"></p>
    </section>

    <section class="card list-card" id="quests" aria-label="Quest log"></section>
    <section class="card" id="curve" aria-label="Levelling curve"></section>
    <section class="card list-card" id="journal" aria-label="Journal"></section>
  </main>

  <footer class="foot">
    <p id="updated"></p>
    <p>Live data from an in-game addon and the game's combat log. World of Warcraft and its map art © Blizzard Entertainment. Fan project, not affiliated with Blizzard.</p>
  </footer>
</body>
</html>
